services:
  database:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: photoscout
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/migrations/001_spatial.sql:/docker-entrypoint-initdb.d/001_spatial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout -d photoscout"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://scout:local-development-only@database:5432/photoscout
      REDIS_URL: redis://redis:6379/0
      LANGSMITH_TRACING: "false"
    depends_on:
      database: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    ports: ["127.0.0.1:3800:3000"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  pgdata:
